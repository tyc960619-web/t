<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分比寬度示範</title>
  

  
</head>
<body>
  <h1>百分比寬度看父元素</h1>
  <p>每一層的 50%，都以自己的父元素內容寬度為基準。</p>
  <p>野獸元素不受其規則影響，為獨立計算，依據使用者對同性的喜好程度決定。(簡單來說:使用者越像Gay，元素越濃厚)</p>

  <div class="parent">
    父元素：頁面的 80%
    <div class="child">
      子元素：父元素的 50%
      <div class="grandchild">
        孫元素：子元素的 50%
      </div>
    </div>
  </div>
</body>
</html>
